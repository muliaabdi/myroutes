<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald Pin Gradient -->
    <linearGradient id="favPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="45%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Route Line Highlight Gradient -->
    <linearGradient id="favLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Inner Core Slate Gradient -->
    <linearGradient id="favCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Subtle Drop Shadow for browser tab contrast -->
    <filter id="tabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Iconic Map Pin Silhouette with Transparent Background -->
  <path
    d="M 256 24 
       C 142 24, 50 116, 50 230 
       C 50 342, 212 452, 246 474 
       C 252 478, 260 478, 266 474 
       C 300 452, 462 342, 462 230 
       C 462 116, 370 24, 256 24 Z"
    fill="url(#favPinGrad)"
    filter="url(#tabShadow)"
  />

  <!-- Top Gloss Highlight -->
  <path
    d="M 256 28 
       C 146 28, 56 118, 56 230 
       C 56 242, 58 254, 60 264 
       C 84 154, 162 72, 256 72 
       C 350 72, 428 154, 452 264 
       C 454 254, 456 242, 456 230 
       C 456 118, 366 28, 256 28 Z"
    fill="#ffffff"
    opacity="0.28"
  />

  <!-- Dark Core Lens Arena -->
  <circle cx="256" cy="214" r="144" fill="url(#favCoreGrad)" stroke="#064e3b" stroke-width="6" />
  <circle cx="256" cy="214" r="144" fill="none" stroke="#34d399" stroke-width="3" opacity="0.5" />

  <!-- Center Route Motif forming stylized 'M' -->
  <path
    d="M 158 266 
       L 190 162 
       L 256 228 
       L 322 162 
       L 354 266"
    fill="none"
    stroke="url(#favLineGrad)"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center Camera Lens Hub -->
  <circle cx="256" cy="228" r="30" fill="#0f172a" stroke="#34d399" stroke-width="6" />
  <circle cx="256" cy="228" r="14" fill="#10b981" />
  <circle cx="251" cy="223" r="4" fill="#ffffff" />

  <!-- Start Point (A) Node -->
  <circle cx="158" cy="266" r="18" fill="#020617" stroke="#34d399" stroke-width="5" />
  <circle cx="158" cy="266" r="8" fill="#6ee7b7" />

  <!-- End Point (B) Node with Arrow -->
  <circle cx="354" cy="266" r="18" fill="#020617" stroke="#34d399" stroke-width="5" />
  <polygon points="347,255 367,266 347,277" fill="#6ee7b7" />

  <!-- Live Pulse Beacon -->
  <circle cx="388" cy="96" r="18" fill="#020617" />
  <circle cx="388" cy="96" r="13" fill="#ef4444" />
  <circle cx="388" cy="96" r="5" fill="#ffffff" />
</svg>
