<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Emerald Pin Gradient -->
    <linearGradient id="ogPinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Core Lens Gradient -->
    <linearGradient id="ogCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Route Line Highlight -->
    <linearGradient id="ogLineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="ogTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Outer Ambient Glow -->
    <filter id="ogGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Subtle Ambient Glow Orbs -->
  <circle cx="280" cy="315" r="260" fill="#10b981" opacity="0.12" filter="url(#ogGlow)" />
  <circle cx="950" cy="180" r="200" fill="#3b82f6" opacity="0.06" filter="url(#ogGlow)" />

  <!-- Decorative Map Grid Coordinates & Radar Lines -->
  <circle cx="280" cy="315" r="220" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 8" opacity="0.18" />
  <circle cx="280" cy="315" r="280" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="12 12" opacity="0.12" />

  <!-- LEFT: Hero App Icon Pin (Centered at 280, 315) -->
  <g transform="translate(100, 135) scale(0.7)">
    <!-- Pin Silhouette -->
    <path
      d="M 256 24 
         C 142 24, 50 116, 50 230 
         C 50 342, 212 452, 246 474 
         C 252 478, 260 478, 266 474 
         C 300 452, 462 342, 462 230 
         C 462 116, 370 24, 256 24 Z"
      fill="url(#ogPinGrad)"
    />

    <!-- Top Gloss Highlight -->
    <path
      d="M 256 28 
         C 146 28, 56 118, 56 230 
         C 56 242, 58 254, 60 264 
         C 84 154, 162 72, 256 72 
         C 350 72, 428 154, 452 264 
         C 454 254, 456 242, 456 230 
         C 456 118, 366 28, 256 28 Z"
      fill="#ffffff"
      opacity="0.28"
    />

    <!-- Dark Core Lens Arena -->
    <circle cx="256" cy="214" r="144" fill="url(#ogCoreGrad)" stroke="#064e3b" stroke-width="6" />
    <circle cx="256" cy="214" r="144" fill="none" stroke="#34d399" stroke-width="3" opacity="0.5" />

    <!-- Center Route 'M' -->
    <path
      d="M 158 266 
         L 190 162 
         L 256 228 
         L 322 162 
         L 354 266"
      fill="none"
      stroke="url(#ogLineGrad)"
      stroke-width="26"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Camera Lens Hub -->
    <circle cx="256" cy="228" r="30" fill="#0f172a" stroke="#34d399" stroke-width="6" />
    <circle cx="256" cy="228" r="14" fill="#10b981" />
    <circle cx="251" cy="223" r="4" fill="#ffffff" />

    <!-- Start & End Nodes -->
    <circle cx="158" cy="266" r="18" fill="#020617" stroke="#34d399" stroke-width="5" />
    <circle cx="158" cy="266" r="8" fill="#6ee7b7" />
    <circle cx="354" cy="266" r="18" fill="#020617" stroke="#34d399" stroke-width="5" />
    <polygon points="347,255 367,266 347,277" fill="#6ee7b7" />

    <!-- Live Beacon -->
    <circle cx="388" cy="96" r="18" fill="#020617" />
    <circle cx="388" cy="96" r="13" fill="#ef4444" />
    <circle cx="388" cy="96" r="5" fill="#ffffff" />
  </g>

  <!-- RIGHT: Typography & Information Lockup -->
  <!-- Category Badge Pill -->
  <g transform="translate(540, 140)">
    <rect width="270" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="20" cy="18" r="6" fill="#10b981" />
    <circle cx="20" cy="18" r="3" fill="#ffffff" />
    <text x="36" y="23" font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.5" fill="#e2e8f0">
      BANDUNG RAYA • LIVE 24H
    </text>
  </g>

  <!-- Brand Title "MyRoutes" -->
  <g transform="translate(540, 245)">
    <text font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="-1.5">
      <tspan fill="#ffffff">My</tspan>
      <tspan fill="url(#ogTextGrad)">Routes</tspan>
    </text>
  </g>

  <!-- Descriptive Subtitle -->
  <g transform="translate(540, 305)">
    <text font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-weight="600" font-size="24" fill="#94a3b8" letter-spacing="-0.3">
      CCTV Bandung Live ATCS Dishub &amp; Lokasi SPKLU EV
    </text>
    <text y="36" font-family="system-ui, -apple-system, 'Inter', Roboto, sans-serif" font-weight="400" font-size="18" fill="#64748b">
      Pantau 500+ kamera jalan real-time &amp; 116+ stasiun pengisian mobil listrik.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(540, 415)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="26" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="14" fill="#34d399">
        ● 500+ CCTV Dishub
      </text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(195, 0)">
      <rect width="170" height="42" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="26" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="14" fill="#38bdf8">
        ⚡ 116+ SPKLU 24 Jam
      </text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="170" height="42" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="20" y="26" font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="14" fill="#facc15">
        🗺️ Rute Bebas Macet
      </text>
    </g>
  </g>

  <!-- Footer Link -->
  <g transform="translate(540, 510)">
    <text font-family="system-ui, -apple-system, 'Inter', sans-serif" font-weight="600" font-size="18" fill="#64748b" letter-spacing="0.5">
      myroutes.muliaabdi.net
    </text>
  </g>
</svg>
